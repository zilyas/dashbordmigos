name: CI

# Validation gate only — this workflow does not deploy anywhere. It exists so
# no push/PR can silently break typecheck, lint, unit tests, the Prisma
# schema, or the production build.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo to validate
# it (typecheck/lint/test/build) — it never comments, releases, or pushes.
permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders only — nothing here is a real secret and this pipeline
      # never talks to a real or shared database.
      #
      # DATABASE_URL is the only DB-related value any step actually needs:
      #   - `prisma validate`/`prisma generate` read it via prisma.config.ts
      #     but never open a connection for either command.
      #   - None of the 9 vitest suites under src/lib/**/*.test.ts import
      #     Prisma or touch a database (verified by inspecting every file).
      #   - `next build --webpack` never queries the DB at build time either:
      #     every dashboard route calls `auth()` (which reads cookies), so
      #     Next marks all of them dynamic ("ƒ") and renders them per-request
      #     rather than at build time. This was confirmed locally by pointing
      #     DATABASE_URL at an unreachable host/port and re-running the exact
      #     same build command with an identical result.
      #   - DIRECT_URL is documented in .env.example but not referenced by
      #     prisma.config.ts or any application code, so it is intentionally
      #     omitted here.
      # Because of this, no Postgres service container is used in this
      # workflow — see the CI section of README.md for the full rationale.
      DATABASE_URL: "postgresql://user:pass@127.0.0.1:5432/nonexistent?sslmode=disable"
      # NextAuth v5 reads AUTH_SECRET at module load time; it must merely be
      # present and non-empty for `tsc`, `next build`, etc. to succeed.
      AUTH_SECRET: "ci-placeholder-secret-not-a-real-secret"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks scans the commit range, so it needs history, not just the
          # tip commit actions/checkout gives by default.
          fetch-depth: 0

      # Runs before anything is installed or built: a leaked credential should
      # fail the run in seconds, not after a 10-minute build.
      #
      # The gitleaks CLI (MIT) is used directly rather than
      # gitleaks/gitleaks-action@v2, which requires a paid GITLEAKS_LICENSE
      # for organization-owned repositories and a read+write GITHUB_TOKEN to
      # post PR comments. `detect` scans the full history, matching what the
      # local .pre-commit-config.yaml hook enforces on staged changes.
      #
      # --config points at .gitleaks.toml, which extends the default ruleset
      # and allowlists a handful of documented placeholder tokens by exact path
      # AND exact string; see the comment block in that file before editing it.
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose --exit-code 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must match the node:24-alpine base image in Dockerfile — CI
          # validating on a different major than production ships on is how
          # a runtime-only break reaches the deploy unnoticed.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `npm ci` runs the `postinstall` script (`prisma generate`), and
      # `npm run build` runs it again via `prebuild`. Adding a third explicit
      # `prisma generate` step here would be a genuine no-op duplicate, so it
      # is intentionally omitted — only schema *validation* is run as its own
      # step below.
      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm run test

      - name: Production build (webpack)
        run: npm run build -- --webpack

  container-smoke:
    name: Container Build & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: "postgresql://user:pass@127.0.0.1:5432/nonexistent?sslmode=disable"
      AUTH_SECRET: "ci-placeholder-secret-not-a-real-secret"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: app:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No build-args: DATABASE_URL and AUTH_SECRET are runtime-only and
          # must never be baked into an image layer.

      - name: Start container
        run: |
          docker run -d \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            -e AUTH_SECRET="${{ env.AUTH_SECRET }}" \
            -e NODE_ENV=production \
            -p 3000:3000 \
            --name app-test \
            app:smoke-test

      # 127.0.0.1, not localhost: the container sets HOSTNAME=0.0.0.0 so Next
      # listens on IPv4 only, while Alpine resolves localhost to ::1 first and
      # busybox wget stops at the refused connection.
      #
      # This waits for the server to *answer*, not to be healthy. DATABASE_URL
      # points at nothing here, so /api/health correctly returns 503 - which is
      # a successful HTTP exchange and proves the process booted and is
      # serving. Whether the body is ok or error is the next step's business.
      - name: Wait for container to be ready
        run: |
          for i in {1..30}; do
            if docker exec app-test node -e "fetch('http://127.0.0.1:3000/api/health').then(() => process.exit(0)).catch(() => process.exit(1))"; then
              echo "Container is serving"
              exit 0
            fi
            echo "Attempt $i/30: waiting for container..."
            sleep 2
          done
          echo "Container failed to become ready"
          docker logs app-test
          exit 1

      # --fail is deliberately absent: 503 is the expected answer with no
      # database, and it still proves the route rendered. The assertion is
      # that the endpoint returns JSON with a status field at all.
      - name: Smoke test health endpoint
        run: |
          response=$(curl -s http://127.0.0.1:3000/api/health)
          status=$(echo "$response" | jq -r '.status // empty')
          if [ -z "$status" ]; then
            echo "ERROR: health endpoint did not return a JSON status field"
            echo "Response: $response"
            exit 1
          fi
          echo "Health endpoint OK: status=$status"

      - name: Cleanup
        if: always()
        run: docker kill app-test || true

  deploy:
    name: Deploy (Coolify)
    # Only master, only a real push, and only once both gates above are green —
    # this is the whole point of triggering the deploy from Actions instead of
    # letting Coolify's own git webhook fire on every push. Coolify would
    # otherwise start building before typecheck, tests, or the container smoke
    # test have said anything.
    needs: [validate, container-smoke]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialise deploys: a second push while one is in flight waits rather than
    # racing it. Not cancel-in-progress — killing a half-finished deploy is
    # worse than letting it land and superseding it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # COOLIFY_WEBHOOK is the full deploy URL from the app's Webhooks tab
      # (https://<coolify-host>/api/v1/deploy?uuid=<app-uuid>&force=false) and
      # COOLIFY_TOKEN is an API token created under Keys & Tokens > API tokens.
      #
      # POST, not GET. Coolify v4.2.0 made every state-changing endpoint
      # POST-only; a GET to /api/v1/deploy now answers 405 with
      # {"message":"This endpoint has changed to a POST request."} and no
      # deployment is queued.
      # https://github.com/coollabsio/coolify/releases/tag/v4.2.0
      #
      # --fail-with-body makes a 4xx/5xx a failed step while still printing
      # Coolify's error message; plain --fail swallows the body, and no flag at
      # all makes curl exit 0 on an HTTP error so a rejected deploy shows up as
      # a green checkmark.
      - name: Trigger Coolify deployment
        id: trigger
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          # Before those secrets exist this job would fail on every master
          # push and turn CI permanently red for a deploy nobody has set up
          # yet. Skipping is loud (a run annotation), not silent.
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_WEBHOOK/COOLIFY_TOKEN not set - skipping deploy. Add them under Settings > Secrets and variables > Actions to enable auto-deploy."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          response=$(curl --fail-with-body --silent --show-error --location \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN")
          echo "Coolify accepted the deploy: $response"
          # Coolify answers {"deployments":[{"deployment_uuid":"...",...}]} —
          # one entry per resource behind the webhook. Only the first is
          # polled below; this webhook points at a single application.
          uuid=$(echo "$response" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$uuid" ]; then
            echo "::warning::Deploy queued but Coolify returned no deployment_uuid - cannot wait for the result."
          fi
          echo "deployment_uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # Without this the job goes green the instant Coolify accepts the
      # request, which says nothing about whether the build succeeded. The
      # status enum is App\Enums\ApplicationDeploymentStatus: queued and
      # in_progress mean keep waiting; finished is the only success; failed
      # and cancelled-by-user are failures.
      #
      # Reading a deployment needs the `read` ability, and Coolify's token UI
      # makes `deploy` mutually exclusive with every other ability — so a
      # deploy-only token gets 403 here. That is not a deploy failure, so it
      # warns and stops instead of failing the job. Use a `root` token if you
      # want the job to actually wait.
      - name: Wait for the deployment to finish
        if: steps.trigger.outputs.skipped == 'false' && steps.trigger.outputs.deployment_uuid != ''
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -uo pipefail
          # The webhook secret is the only place the instance URL is stored,
          # so the API base is derived from it rather than kept as a third
          # secret that could drift out of sync with the first two.
          base="${COOLIFY_WEBHOOK%%/api/v1/deploy*}"
          url="$base/api/v1/deployments/$DEPLOYMENT_UUID"
          # Coolify has a race where a just-queued deployment 404s for a
          # moment (coollabsio/coolify#8925), so an early 404 is retried
          # rather than treated as a lost deploy.
          for i in $(seq 1 90); do
            body=$(curl --silent --show-error --location \
              --write-out '\n%{http_code}' \
              --header "Authorization: Bearer $COOLIFY_TOKEN" "$url")
            code=$(echo "$body" | tail -n1)
            payload=$(echo "$body" | sed '$d')
            case "$code" in
              200) ;;
              401|403)
                echo "::warning::Token cannot read deployment status (HTTP $code). Deploy was queued; not waiting for it. Use a root-ability token to enable waiting."
                exit 0 ;;
              404)
                if [ "$i" -le 5 ]; then sleep 10; continue; fi
                echo "::warning::Deployment $DEPLOYMENT_UUID not found after 5 attempts. Deploy was queued; check Coolify."
                exit 0 ;;
              *)
                echo "::warning::Unexpected HTTP $code reading deployment status: $payload"
                sleep 10; continue ;;
            esac
            status=$(echo "$payload" | jq -r '.status // empty')
            case "$status" in
              finished)
                echo "Deployment finished successfully."
                exit 0 ;;
              failed|cancelled-by-user)
                echo "Deployment ended with status: $status"
                echo "$payload" | jq -r '.logs // empty' | tail -n 50
                exit 1 ;;
              queued|in_progress)
                echo "Attempt $i/90: deployment is $status..."
                sleep 10 ;;
              *)
                echo "::warning::Unrecognised deployment status '$status' - treating as pending."
                sleep 10 ;;
            esac
          done
          echo "::warning::Deployment still running after 15 minutes. Not failing the job - check Coolify's Deployments tab."
