# Pre-commit hooks for security and code quality.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Gitleaks: Secret scanning to prevent credentials from being committed
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Gitleaks - Detect secrets
        description: Scans commits to prevent secrets (API keys, passwords, tokens) from being committed
        entry: gitleaks protect --verbose --redact --exit-code 1 --staged
        language: golang
        stages: [commit]
        pass_filenames: false
        always_run: true

  # Optional: Prettier for code formatting (uncomment to enable)
  # - repo: https://github.com/pre-commit/mirrors-prettier
