# Pre-commit hooks for security and code quality.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Gitleaks: Secret scanning to prevent credentials from being committed
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Gitleaks - Detect secrets
        description: Scans commits to prevent secrets (API keys, passwords, tokens) from being committed
        entry: gitleaks protect --verbose --redact --exit-code 1 --staged
        language: golang
        stages: [commit]
        pass_filenames: false
        always_run: true

  # lint-staged: Run linters and formatters on staged files
  - repo: local
    hooks:
      - id: lint-staged
        name: Lint-staged
        entry: npx lint-staged
        language: system
        stages: [pre-commit]
        pass_filenames: false

  # Prettier: Code formatting check
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        language_version: "18.0.0"
        types: [javascript, jsx, typescript, tsx, json, css, markdown]

  # TypeScript type checking
  - repo: local
    hooks:
      - id: tsc-no-emit
        name: TypeScript type check
        entry: npx tsc --noEmit
        language: system
        stages: [pre-commit]
        pass_filenames: false
