# Single-service compose file — the database is external (Neon), so there's
# no local Postgres container to orchestrate. Useful for local Docker
# smoke-testing and as a reference for Coolify's Docker Compose deployment
# mode; Coolify's own UI is the source of truth for the running deployment.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # DATABASE_URL and AUTH_SECRET are deliberately NOT build args. A build
        # arg is baked into the image layer metadata forever — anyone who can
        # pull or inspect the image (or run `docker history`) reads it back
        # out, even after the layer is "removed" in a later stage. They reach
        # the app only at runtime, via the env_file below.
        #
        # R2_PUBLIC_BASE_URL stays a build arg. It is a public bucket URL, not
        # a secret, and it MUST stay a build arg because next/image
        # remotePatterns and the CSP img-src are baked into the standalone
        # build. Do not remove it, and do not add other secrets here.
        R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Run at a single replica: the in-memory rate limiter
    # (src/lib/security/rate-limit.ts) is per-instance, not shared across
    # replicas. Scaling beyond 1 requires moving it to Redis/Upstash first.
    deploy:
      replicas: 1
    volumes:
      - uploads:/app/public/uploads
      - backups:/app/storage/backups
    # 127.0.0.1, not localhost: the image sets HOSTNAME=0.0.0.0 so Next listens
    # on IPv4 only, and Alpine resolves localhost to ::1 first.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  uploads:
  backups:
