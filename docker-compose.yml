# Self-hosted stack: Postgres and Redis run as their own services (own Coolify
# resources in production, not sidecars baked into the app image), so each can
# be versioned, backed up, and restarted independently of the app. Useful for
# local Docker smoke-testing and as a reference for Coolify's Docker Compose
# deployment mode; Coolify's own UI is the source of truth for the running
# deployment.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # DATABASE_URL and AUTH_SECRET are deliberately NOT build args. A build
        # arg is baked into the image layer metadata forever — anyone who can
        # pull or inspect the image (or run `docker history`) reads it back
        # out, even after the layer is "removed" in a later stage. They reach
        # the app only at runtime, via the env_file below.
        #
        # R2_PUBLIC_BASE_URL stays a build arg. It is a public bucket URL, not
        # a secret, and it MUST stay a build arg because next/image
        # remotePatterns and the CSP img-src are baked into the standalone
        # build. Do not remove it, and do not add other secrets here.
        R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run at a single replica: scaling beyond 1 needs RATE_LIMIT_REDIS_URL set
    # (see src/lib/security/rate-limit.ts) so the login/password-reset rate
    # limiter is shared across replicas instead of per-instance.
    deploy:
      replicas: 1
    volumes:
      - uploads:/app/public/uploads
      - backups:/app/storage/backups
    # 127.0.0.1, not localhost: the image sets HOSTNAME=0.0.0.0 so Next listens
    # on IPv4 only, and Alpine resolves localhost to ::1 first.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Not reachable from the app via a `-pooler` or similar split: this is a
  # direct connection, no PgBouncer-style pooler in front of it (see
  # prisma.config.ts and src/lib/prisma.ts's own pool). In Coolify this runs
  # as its own resource with its own backup schedule, not a sidecar container
  # tied to the app's lifecycle.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      # No default here on purpose: an empty/default password shipping to
      # production is worse than a container that refuses to start without
      # one set explicitly in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backs the login/password-reset rate limiter only (src/lib/security/rate-
  # limit.ts) — no query caching, no sessions here. Persistence (AOF) means a
  # restart doesn't silently reset every rate-limit counter to zero, and
  # requirepass means this is not an open, unauthenticated instance (unlike
  # the platform project's reference Redis, which ships with neither).
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  uploads:
  backups:
  postgres-data:
  redis-data:
